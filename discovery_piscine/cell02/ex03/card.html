<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Profile</h2>
        </div>

        <table class="card-table">
            <tr>
                <td>
                    <img src="image.png" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login">
                    login
                </td>
            </tr>
            <tr>
                <td class="description">
                    Full Stack Developer
                </td>
            </tr>
            <tr>
                <td class="socials">
                    <img src="https://th.wikipedia.org/wiki/%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C:Instagram_icon.png" alt="Social 1" class="social-icon">
                    <img src="" alt="Social 2" class="social-icon">
                    <img src="" alt="Social 3" class="social-icon">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
