<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Profile</h2>
        </div>

        <table class="card-table">
            <tr>
                <td>
                    <img src="image.png" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login">
                    login
                </td>
            </tr>
            <tr>
                <td class="description">
                    Half Stack Developer
                </td>
            </tr>
            <tr>
                <td class="socials">
                    <img src="https://img.magnific.com/free-vector/instagram-logo_1199-122.jpg?semt=ais_hybrid&w=740&q=80" alt="Social 1" class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/2190/2190400.png" alt="Social 2" class="social-icon">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREMIA626uZmq14qkxarZCZIbcW4fR9v-HXrxeI0t6n61SF7AwTea7Wk-k&s=10" alt="Social 3" class="social-icon">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
