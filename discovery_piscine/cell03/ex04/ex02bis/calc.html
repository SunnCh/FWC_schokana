<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's over 9000 (jQuery)</title>
    <link rel="stylesheet" href="calc.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="calc-container">
        <form id="calc-form">
            <input type="text" id="left-op" placeholder="Left operand">
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>
            <input type="text" id="right-op" placeholder="Right operand">
            <input type="submit" value="Try me!">
        </form>
    </div>

    <script src="calc.js"></script>
</body>
</html>
